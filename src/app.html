<title>197カ国 暗記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#E9EEEC; --panel:#F8F9F6; --ink:#17262E; --muted:#5E6F75; --line:#CAD5D3;
  --ocean:#C7D9E0; --land:#F4F1E8; --border:#A9B8B6; --grat:rgba(23,38,46,.08); --sea:#5D8497;
  --hi:#E3662A; --hi-ink:#FFFFFF; --ok:#23805A; --ok-bg:#DDEFE5; --ng:#C23A3A; --ng-bg:#F6E0DD;
  --chip:#DDE5E3;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E171C; --panel:#15222A; --ink:#E4ECEA; --muted:#8FA3A7; --line:#27383F;
    --ocean:#12303D; --land:#2C3D43; --border:#4A5E63; --grat:rgba(228,236,234,.07); --sea:#7FA9BC;
    --hi:#F08A45; --hi-ink:#1A0E06; --ok:#5CC994; --ok-bg:#16352A; --ng:#F07A72; --ng-bg:#3A1D1D;
    --chip:#1F2F36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E171C; --panel:#15222A; --ink:#E4ECEA; --muted:#8FA3A7; --line:#27383F;
  --ocean:#12303D; --land:#2C3D43; --border:#4A5E63; --grat:rgba(228,236,234,.07); --sea:#7FA9BC;
  --hi:#F08A45; --hi-ink:#1A0E06; --ok:#5CC994; --ok-bg:#16352A; --ng:#F07A72; --ng-bg:#3A1D1D;
  --chip:#1F2F36;
}
*{box-sizing:border-box}
.flagimg{height:.78em;width:auto;vertical-align:-.02em;border-radius:.08em;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.meter{min-width:240px;flex:0 1 340px;display:flex;flex-direction:column;gap:6px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.meter b{font-family:var(--mono);font-size:22px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b3{background:var(--ok)} .bar .b1{background:color-mix(in srgb,var(--ok) 40%,var(--chip))}
.controls{display:flex;flex-direction:column;gap:10px}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.tab{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip{border:0;background:var(--chip);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.range{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.range b{font-weight:700}
.range select{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px;max-width:190px}
.range .cnt{font-family:var(--mono);color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:840px){main{grid-template-columns:1fr}}
.globe{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:840px){.globe{position:static}}
.gwrap{position:relative}
#cv{width:100%;aspect-ratio:1/1;max-width:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#mini{position:absolute;left:0;bottom:0;width:38%;aspect-ratio:2/1;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);pointer-events:none}
.gnote{font-size:11.5px;color:var(--muted);text-align:right;margin-top:-6px}
.info{display:flex;gap:14px;align-items:flex-start;min-height:74px}
.info .fl{font-size:56px;line-height:1}
.info .nm{font-family:var(--display);font-size:22px;line-height:1.25;text-wrap:balance}
.info dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--muted)}
.info dt{font-weight:700;white-space:nowrap}.info dd{margin:0}
.info dd.where{color:var(--ink)}
.info .hint{color:var(--muted);font-size:13px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.qlabel{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.prompt{display:flex;align-items:center;justify-content:center;min-height:150px;text-align:center}
.prompt .bigflag{font-size:clamp(96px,16vw,150px);line-height:1}
.prompt .bigname{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1.2;text-wrap:balance}
.prompt .sub{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.choices{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--ground);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px;font-weight:700;min-height:58px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.choice .ef{font-size:42px;line-height:1}
.choices.flags .choice{justify-content:center}
.choice.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.choice.ng{border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.choice:disabled{cursor:default}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.next{border:0;background:var(--ink);color:var(--ground);padding:10px 20px;border-radius:8px;font-weight:700}
.stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:20px}
.list h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.list h2 span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tile{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--ground);border-radius:8px;padding:6px 8px;text-align:left;font-size:13.5px;font-weight:500;line-height:1.3}
.tile:hover{border-color:var(--line)}
.tile.out{opacity:.38}
.tile[aria-current="true"]{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 14%,var(--ground));opacity:1}
.tile .no{font-family:var(--mono);font-size:11px;color:var(--muted);width:18px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tile .ef{font-size:24px;line-height:1;flex:none}
.tile .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-left:auto;background:var(--chip)}
.tile .dot.l1{background:color-mix(in srgb,var(--ok) 45%,var(--chip))}
.tile .dot.l3{background:var(--ok)}
.tile .dot.l0{background:var(--ng)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tools{display:flex;justify-content:flex-end;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.link{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:12px;padding:2px}
.confirm{display:inline-flex;gap:8px;align-items:center}
.confirm button{border:1px solid var(--ng);background:none;color:var(--ng);border-radius:6px;padding:2px 10px;font-size:12px}
main.solo{grid-template-columns:minmax(0,1fr)}
.tab.test{border-color:var(--hi);color:var(--hi)}
.tab.test[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .lead{margin:0;color:var(--muted);font-size:14px}
.sheet h3{font-size:14px;letter-spacing:.08em;margin:0 0 8px;font-weight:700}
.tmapwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--ocean);max-width:100%}
#tmap{display:block}
.tmapnote{font-size:12px;color:var(--muted);margin:-10px 0 0}
.tcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.tcols{grid-template-columns:1fr}}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.atable td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.acard{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--ground);border-radius:8px;padding:6px 8px;text-align:left;font-size:14px;line-height:1.25}
.acard:hover{border-color:var(--ink)}
.acard.cur{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 16%,var(--ground))}
.anum{flex:none;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:var(--ink);color:var(--panel);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.acard.cur .anum,.ainfo .anum{background:var(--hi);color:var(--hi-ink)}
.acard .ef{font-size:28px;line-height:1;flex:none}
.atx{display:flex;flex-direction:column;min-width:0}
.atx small{color:var(--muted);font-size:11.5px}
.ainfo{display:flex;align-items:center;gap:10px;min-height:52px;background:var(--ground);border-radius:10px;padding:8px 12px}
.ainfo .ef{font-size:40px;line-height:1;flex:none}
.ainfo .atx b{font-size:16px}
.ainfo .atx small{font-size:12.5px;line-height:1.5}
.ainfo .hint{color:var(--muted);font-size:13px}
.atable tr.cur td{background:color-mix(in srgb,var(--hi) 16%,transparent)}
.atable tr.cur .num{color:var(--hi)}
#tmap{cursor:pointer}
.atable .num{font-family:var(--display);font-size:16px;width:34px;text-align:center}
.atable input{width:100%;min-width:0;font:inherit;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.atable select{font:inherit;background:var(--ground);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 4px;width:64px}
.atable input:focus-visible,.atable select:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.atable .res{font-size:12px;line-height:1.3;margin-top:3px}
.atable .res.ok{color:var(--ok)} .atable .res.ng{color:var(--ng)}
.atable td.okc input,.atable td.okc select{border-color:var(--ok);background:var(--ok-bg)}
.atable td.ngc input,.atable td.ngc select{border-color:var(--ng);background:var(--ng-bg)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bank div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.bank .cn{font-family:var(--display);font-size:16px}
.bank .ef{font-size:46px;line-height:1.05}
.bank .an{font-size:11px;color:var(--muted);min-height:1em;text-align:center;line-height:1.2}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tbar .ghost{border:1px solid var(--line);background:var(--ground);padding:9px 16px;border-radius:8px;font-weight:700}
.score{font-family:var(--display);font-size:28px}
.score small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>197カ国 暗記帳<small>国旗・国名・場所をセットで覚える　「世界の国旗」国旗一覧（大陸ごと）と同じ並び</small></h1>
    <div class="meter" aria-live="polite">
      <div class="row"><span>覚えた国（3回連続正解）</span><span><b id="mCount">0</b> / <span id="mTotal">15</span></span></div>
      <div class="bar"><i class="b3" id="bar3"></i><i class="b1" id="bar1"></i></div>
    </div>
  </header>

  <div class="controls">
    <div class="tabs" role="group" aria-label="モード">
      <button class="tab" data-mode="browse" id="t-browse">図鑑で見る</button>
      <button class="tab" data-mode="atlas" id="t-atlas">地図で一覧</button>
      <button class="tab" data-mode="flag" id="t-flag">国旗 → 国名</button>
      <button class="tab" data-mode="map" id="t-map">場所 → 国名</button>
      <button class="tab" data-mode="name" id="t-name">国名 → 国旗</button>
      <button class="tab test" data-mode="test" id="t-test">テスト</button>
    </div>
    <div class="chips" role="group" aria-label="地域" id="chips"></div>
    <div class="range" id="range"></div>
  </div>

  <main>
    <section class="globe" id="globeSec" aria-label="地球儀">
      <div class="gwrap">
        <canvas id="cv" aria-label="選んだ国を示す地球儀。ドラッグで回せます"></canvas>
        <canvas id="mini" aria-hidden="true"></canvas>
      </div>
      <div class="gnote">ドラッグで回せます・左下は世界全体での位置</div>
      <div class="info" id="info"></div>
    </section>
    <section id="right"></section>
  </main>

  <div class="tools">
    <span>記録はこのブラウザに保存されます</span>
    <span id="resetWrap"><button class="link" id="resetBtn">記録をリセット</button></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const C = __DATA__;
// 絵文字の国旗が「世界の国旗」の一覧（紋章入り）と違う国は、紋章入りの国旗画像を使う
// （ウィキメディア・コモンズ、パブリックドメイン）
const FLAG_IMG = { PE: "flags/pe.svg", CR: "flags/cr.svg" };
for (const c of C) if (FLAG_IMG[c.c]) c.f = `<img class="flagimg" src="${FLAG_IMG[c.c]}" alt="">`;
const REGIONS = ["アジア","ヨーロッパ","アフリカ","北アメリカ","南アメリカ","オセアニア"];
const byCode = new Map(C.map(c => [c.c, c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 位置の覚え方（アジア・オセアニア） */
const WHERE = {
AZ:"カスピ海の西岸。コーカサス3国（ジョージア・アルメニア・アゼルバイジャン）のいちばん東。南はイラン。",
AF:"海のない内陸国。西はイラン、東と南はパキスタン、北は中央アジアの国々。",
AE:"アラビア半島の東の端、ペルシャ湾の出口の近く。サウジアラビアとオマーンにはさまれる。",
AM:"コーカサス3国のまん中の内陸国。西はトルコ、東はアゼルバイジャン、南はイラン。",
YE:"アラビア半島の南西の端。北はサウジアラビア。紅海の出口をはさんだ向かいはアフリカ。",
IL:"地中海のいちばん東の岸。北はレバノン、東はヨルダン、南西はエジプト。",
IQ:"ペルシャ湾の奥。チグリス川・ユーフラテス川の国。東はイラン、西はシリア・ヨルダン、南はサウジアラビア。",
IR:"北はカスピ海、南はペルシャ湾。西はイラク・トルコ、東はアフガニスタン・パキスタン。",
IN:"南アジアの大きな逆三角形の半島。左（西）はアラビア海、右（東）はベンガル湾、北にヒマラヤ。",
ID:"赤道にまたがる東南アジアの島国。スマトラ島・ジャワ島など東西に長く島が並ぶ。北はマレーシア。",
UZ:"中央アジアのまん中。北と西はカザフスタン、南はアフガニスタン・トルクメニスタン。",
OM:"アラビア半島の南東の角。アラビア海に面する。北西はアラブ首長国連邦、西はサウジアラビア。",
KZ:"中央アジアでいちばん大きい。カスピ海の東、北はロシア、東は中国。世界最大の内陸国。",
QA:"ペルシャ湾に親指のように突き出た小さな半島。南はサウジアラビア、西にバーレーン。",
KH:"インドシナ半島の南部。北西はタイ、北はラオス、東はベトナム。南はタイランド湾。",
KP:"朝鮮半島の北半分。北は中国、南は大韓民国。東は日本海。",
KG:"中央アジアの山国。東は中国、北はカザフスタン、西はウズベキスタン、南はタジキスタン。",
KW:"ペルシャ湾のいちばん奥の小国。北はイラク、南はサウジアラビア。",
SA:"アラビア半島の大部分をしめる大きな国。西は紅海、東はペルシャ湾。",
GE:"コーカサス3国のいちばん北西。黒海の東岸で、北はロシア。",
SY:"地中海の東岸。北はトルコ、東はイラク、南はヨルダン、西はレバノン。",
SG:"マレー半島の南の先にある小さな島国。北はマレーシア、南はインドネシア。",
LK:"インドの南東、インド洋にうかぶしずく形の島国。",
TH:"インドシナ半島のまん中。西はミャンマー、東はラオス・カンボジア、南はマレーシア。",
KR:"朝鮮半島の南半分。北は北朝鮮、海をはさんで東に日本。",
TJ:"中央アジアの南東の山国。南はアフガニスタン、東は中国、北はキルギス・ウズベキスタン。",
CN:"東アジアの大国。東は東シナ海・黄海。14か国と国境を接する。",
TM:"中央アジアの南西、カスピ海の東岸。南はイラン・アフガニスタン。",
TR:"アジアとヨーロッパの境目。北は黒海、南と西は地中海。東はジョージア・アルメニア・イラン。",

function tok(){ const s = getComputedStyle(document.documentElement); const g = n => s.getPropertyValue(n).trim(); return { ocean:g("--ocean"), land:g("--land"), border:g("--border"), grat:g("--grat"), hi:g("--hi"), ink:g("--ink"), panel:g("--panel"), muted:g("--muted"), sea:g("--sea") }; }

function viewAngle(cc){

function labelFont(sz, w){ return `${w} ${sz}px "Zen Kaku Gothic New","Hiragino Sans",sans-serif`; }
function draw(){
  const w = cv.clientWidth; if (!w) return;

  const inDisc = b => [[b[0],b[1]],[b[2],b[1]],[b[0],b[3]],[b[2],b[3]]].every(([x,y]) => Math.hypot(x-w/2, y-w/2) < R-3);

  const SMALL = 70;
  // ラベルは「画面に見えている部分」だけで中心と面積を計算する（拡大中に名前が画面の外へ出ないように）
  const visAng = Math.min(90, Math.asin(Math.min(1, 1/G.scale)) * 180/Math.PI * 0.96);
  const lpath = d3.geoPath(d3.geoOrthographic().translate([w/2, w/2]).scale(R*G.scale).rotate(G.rot).clipAngle(visAng));
  function labelAt(cc, isT){
    const f = featBy.get(cc), c = byCode.get(cc);
    const a = f ? lpath.area(f) : 0;
    // 丸印がつく国（面積400未満）は名前を印の下に
    if (a >= (isT ? 400 : SMALL)){ const [x,y] = lpath.centroid(a > 4 * lpath.area(f.main) ? f : f.main); return isFinite(x) ? {x, y, a, small:false} : null; }

  }

    const at = labelAt(G.target, true);
    if (at){ ctx.font = labelFont(15, 700); const tw = ctx.measureText(byCode.get(G.target).n).width; boxes.push([at.x-tw/2-3, at.y-11, at.x+tw/2+3, at.y+11]); }
    if (at && at.small) boxes.push([at.dot[0]-18, at.dot[1]-18, at.dot[0]+18, at.dot[1]+18]);   // 丸印の上に名前を重ねない
  }
  for (const [nm, la, lo] of SEAS){
    if (d3.geoDistance([lo,la], center) > 1.35) continue;
    const big = nm.endsWith("洋");
    if (!big && G.scale < 1.6) continue;
    const [x,y] = p([lo,la]);
    ctx.font = `italic 500 ${big ? seaSize+2 : seaSize}px "Zen Kaku Gothic New",sans-serif`;
    const tw = ctx.measureText(nm).width, b = [x-tw/2-2, y-8, x+tw/2+2, y+8];

  const L = [], near = Math.min(1.35, visAng * Math.PI / 180 + 0.3);
  for (const c of C){
    const cc = c.c; if (G.hide.has(cc)) continue;
    if (d3.geoDistance(spot(cc), center) > near) continue;   // 見えていない国は計算しない

    ctx.font = labelFont(sz, l.isT ? 700 : 500);

    for (let k = 0; k < 6 && !inDisc(box()) && !l.small; k++){ x += (w/2 - x) * .15; y += (w/2 - y) * .15; }
    const b = box();

    boxes.push(b);
    if (l.small && !l.isT){ ctx.beginPath(); ctx.arc(l.dot[0], l.dot[1], 2.5, 0, Math.PI*2); ctx.fillStyle = T.muted; ctx.fill(); }
    ctx.lineJoin = "round"; ctx.lineWidth = 3.5; ctx.strokeStyle = l.isT ? T.panel : T.land; ctx.strokeText(nm, x, y);
    ctx.fillStyle = l.isT ? T.ink : T.muted; ctx.fillText(nm, x, y);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(w/2,w/2,R,0,Math.PI*2); ctx.strokeStyle = T.border; ctx.lineWidth = 1; ctx.stroke();
  if (G.marker){
    const ll = spot(G.marker);
    if (d3.geoDistance(ll, center) < Math.PI/2){
      const small = !tf || path.area(tf.main) < 400;
      if (small){ const [x,y] = p(ll);
        ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.strokeStyle = T.hi; ctx.lineWidth = 2.5; ctx.stroke(); }
    }

}

  const key = [mini.width, mini.height, T.ocean, T.land, T.border].join("|");

    const off = document.createElement("canvas"); off.width = mini.width; off.height = mini.height;
    const oc = off.getContext("2d"); oc.setTransform(mini.width / mw, 0, 0, mini.height / mh, 0, 0);
    const op = d3.geoPath(p, oc);
    oc.beginPath(); op({type:"Sphere"}); oc.fillStyle = T.ocean; oc.fill();
    oc.beginPath(); for (const f of feats) op(f); oc.fillStyle = T.land; oc.fill();
    oc.strokeStyle = T.border; oc.lineWidth = .3; oc.stroke();

    if (tf){ mctx.beginPath(); path(tf); mctx.fillStyle = T.hi; mctx.fill(); }

}
function flyTo(cc, show, hide){
  const c = byCode.get(cc);

  const toScale = 1/Math.sin(viewAngle(cc)*Math.PI/180);

}

function goTo(toRot, toScale, cc, hide){
  G.target = cc; G.marker = cc; G.hide = hide || new Set();
  if (G.anim) G.anim.stop();
  if (reduce){ G.rot = toRot; G.scale = toScale; draw(); return; }
  const fromRot = G.rot.slice(), fromScale = G.scale;
  let dl = toRot[0] - fromRot[0]; dl = ((dl + 540) % 360) - 180;
  const ir = d3.interpolate(fromRot, [fromRot[0]+dl, toRot[1], 0]);
  const zoomOut = Math.min(fromScale, toScale, Math.abs(dl) > 60 ? 1.1 : 99);

    const t = Math.min(1, el/900), e = d3.easeCubicInOut(t);
    G.rot = ir(e);

    G.scale = e < .5 ? a : b;
    draw(); if (t >= 1) G.anim.stop();
  });

    } else f.main = f.geometry;

// 島の中にある点（重心が海に落ちる形の島では、ふちからいちばん遠い点をさがす）
function innerPoint(g){
  const c = d3.geoCentroid(g);
  if (d3.geoContains(g, c)) return c;
  const ring = g.coordinates[0];
  let [[x0, y0], [x1, y1]] = d3.geoBounds(g);
  if (x1 < x0) x1 += 360;   // 日付変更線をまたぐ島
  let best = null, bd = -1;
  for (let i = 1; i < 16; i++) for (let j = 1; j < 16; j++){
    let x = x0 + (x1 - x0) * i / 16; if (x > 180) x -= 360;
    const q = [x, y0 + (y1 - y0) * j / 16];
    if (!d3.geoContains(g, q)) continue;
    let md = Infinity;
    for (let k = 0; k < ring.length; k += Math.max(1, ring.length >> 6)) md = Math.min(md, d3.geoDistance(q, ring[k]));
    if (md > bd){ bd = md; best = q; }
  }
  return best || ring[0];
}
// 国の印をつける地点 [経度, 緯度]
const spot = cc => { const f = featBy.get(cc); if (f && f.pt) return f.pt; const c = byCode.get(cc); return [c.ll[1], c.ll[0]]; };

  const crowd = Math.max(1, Math.min(3.5, 32 / Math.max(1, d3.quantile(nn.slice().sort(d3.ascending), .15))));

// 番号を、国をかくさず・線が交差しにくい位置に置く
function layoutBadges(path, p, w, h, BR, RING){
  const TS = curSheet();
  const nodes = TS.nums.map((cc, i) => {
    const f = featBy.get(cc); const [x,y] = p(spot(cc));   // 国（島）の陸の上の点
    const a = f ? path.area(f) : 0;
    // tiny：島国など点のような国 → 丸で囲む。small：番号で隠れてしまう国 → 番号を外に出して線で指す
    return { i, cc, ax:x, ay:y, tiny: a < 180, small: a < 1500, r: BR + 2 };
  });
  // 島国の番号は、出題の国ぜんたいの中心から外向きに出す（線が放射状に広がって交差しにくい）
  const mx = d3.mean(nodes, n => n.ax), my = d3.mean(nodes, n => n.ay);
  for (const nd of nodes){
    if (!nd.small){ nd.x = nd.ax; nd.y = nd.ay; continue; }
    let dx = nd.ax - mx, dy = nd.ay - my; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    if (L < 2){ dx = .7; dy = -.7; }
    nd.x = nd.ax + dx * (RING + BR + 12); nd.y = nd.ay + dy * (RING + BR + 12);
  }
  // 丸印は動かない障害物にして、番号が島をかくさないようにする
  const rings = nodes.filter(nd => nd.small).map(nd => ({ fx: nd.ax, fy: nd.ay, x: nd.ax, y: nd.ay, r: RING + 3, ring: true }));
  const sim = d3.forceSimulation([...nodes, ...rings])
    .force("x", d3.forceX(n => n.ring ? n.fx : n.small ? n.x : n.ax).strength(n => n.ring ? 0 : n.small ? .05 : .3))
    .force("y", d3.forceY(n => n.ring ? n.fy : n.small ? n.y : n.ay).strength(n => n.ring ? 0 : n.small ? .05 : .3))
    .force("c", d3.forceCollide(n => n.r).iterations(2)).stop();
  for (let k = 0; k < 300; k++) sim.tick();
  for (const nd of nodes){ nd.x = Math.max(BR + 3, Math.min(w - BR - 3, nd.x)); nd.y = Math.max(BR + 3, Math.min(h - BR - 3, nd.y)); }
  // 交差している線があれば、2つの番号の位置を入れかえる
  const cross = (a, b) => {
    const o = (p, q, r) => Math.sign((q[0]-p[0])*(r[1]-p[1]) - (q[1]-p[1])*(r[0]-p[0]));
    const A = [a.ax, a.ay], B = [a.x, a.y], C = [b.ax, b.ay], D = [b.x, b.y];

  const moved = nodes.filter(nd => nd.small || Math.hypot(nd.x-nd.ax, nd.y-nd.ay) > 4);
  for (let pass = 0; pass < 4; pass++){
    let swapped = false;
    for (let a = 0; a < moved.length; a++) for (let b = a + 1; b < moved.length; b++){
      const A = moved[a], B = moved[b];
      if (!cross(A, B)) continue;
      const before = Math.hypot(A.x-A.ax, A.y-A.ay) + Math.hypot(B.x-B.ax, B.y-B.ay);
      const after = Math.hypot(B.x-A.ax, B.y-A.ay) + Math.hypot(A.x-B.ax, A.y-B.ay);
      if (after <= before * 1.3){ [A.x, B.x] = [B.x, A.x]; [A.y, B.y] = [B.y, A.y]; swapped = true; }
    }
    if (!swapped) break;
  }
  return nodes;
}
// 番号をえらぶ：地図と解答らんの行を光らせる
function setTestFocus(i){
  const TS = curSheet();
  if (!TS || TS.focus === i) return;
  TS.focus = i;
  document.querySelectorAll(".atable tbody tr").forEach((tr, k) => tr.classList.toggle("cur", k === i));
  document.querySelectorAll(".acard").forEach((el, k) => { el.classList.toggle("cur", k === i); el.setAttribute("aria-pressed", k === i); });
  if (S.saved.mode === "atlas") renderAtlasInfo();
  drawTestMap();
}
/* ---------- 地図で一覧（テストと同じ地図に答えを並べる） ---------- */
const curSheet = () => S.saved.mode === "atlas" ? S.sheet : S.test;
const atlasKey = () => [S.saved.region, S.saved.from, S.saved.to].join("|");
function renderAtlas(){
  if (!S.sheet || S.sheet.key !== atlasKey()){
    const P = pool();
    // 番号は「世界の国旗」国旗一覧の番号（全世界のときは1から通し番号）
    S.sheet = { key: atlasKey(), nums: P.map(c => c.c), label: P.map((c, i) => S.saved.region === "all" ? i + 1 : c.no), graded: false, focus: null, layout: null };
  }
  const SH = S.sheet, n = SH.nums.length;
  const rangeTxt = S.saved.region === "all" ? "全世界" : `${S.saved.region} ${S.saved.from}〜${S.saved.to}番`;
  const cards = SH.nums.map((cc, i) => { const c = byCode.get(cc);
    return `<button class="acard ${SH.focus === i ? "cur" : ""}" data-ai="${i}" aria-pressed="${SH.focus === i}">
      <span class="anum">${SH.label[i]}</span><span class="ef" aria-hidden="true">${c.f}</span>
      <span class="atx"><b>${esc(c.n)}</b><small>${esc(c.cap)}</small></span></button>`; }).join("");
  $("right").innerHTML = `<div class="sheet">
    <div><h2>地図で一覧</h2><p class="lead">範囲：${rangeTxt}（${n}カ国）　番号は国旗一覧の番号です。下の国を選ぶと地図のその国が光り、地図の番号をタップすると下の国が光ります。</p></div>
    <div class="tmapwrap" id="tmapwrap"><canvas id="tmap" aria-label="番号がついた地図"></canvas></div>
    <p class="tmapnote" id="tmapnote" hidden>国どうしが近いので地図を大きくしています。地図は縦横にスクロールできます。</p>
    <div class="ainfo" id="atlasInfo" aria-live="polite"></div>
    <div class="acards">${cards}</div>
  </div>`;
  renderAtlasInfo();
  drawTestMap();
}
// 選んでいる国の国旗・国名・場所の覚え方を地図のすぐ下に出す
function renderAtlasInfo(){
  const el = $("atlasInfo"); if (!el || !S.sheet) return;
  const i = S.sheet.focus;
  if (i === null || i === undefined){ el.innerHTML = `<span class="hint">国を選ぶと、ここに国旗と場所の覚え方が出ます。</span>`; return; }
  const c = byCode.get(S.sheet.nums[i]);
  el.innerHTML = `<span class="anum">${S.sheet.label[i]}</span><span class="ef" aria-hidden="true">${c.f}</span>
    <span class="atx"><b>${esc(c.n)}</b><small>首都 ${esc(c.cap)}${WHERE[c.c] ? "　" + esc(WHERE[c.c]) : ""}</small></span>`;
}

function gradeTest(){
  const T2 = S.test; T2.graded = true;
  T2.nums.forEach((cc, i) => {
    const ok = nameOk(cc, T2.name[i]) && T2.flag[i] !== undefined && T2.flag[i] !== "" && +T2.flag[i] === T2.flags.indexOf(cc);
    S.saved.p[cc] = ok ? Math.max(0, lv(cc)) + 1 : 0;
  });
  save(); renderMeter(); renderTest(); window.scrollTo({top: 0, behavior: reduce ? "auto" : "smooth"});
}
new ResizeObserver(() => { if (isSheetMode()) drawTestMap(); }).observe(document.getElementById("right"));

function render(){
  renderTabs(); renderChips(); renderMeter();
  const isSheet = S.saved.mode === "test" || S.saved.mode === "atlas";
  $("globeSec").hidden = isSheet; document.querySelector("main").classList.toggle("solo", isSheet);
  if (S.saved.mode === "test"){ renderTest(); return; }
  if (S.saved.mode === "atlas"){ renderAtlas(); return; }
  if (S.saved.mode === "browse"){ if (S.saved.region !== "all" && !inPool(S.sel)) S.sel = pool()[0].c; renderBrowse(); if (feats.length) refreshGlobe(); }
  else { S.q = null; S.recent = []; next(); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.mode){ S.saved.mode = t.dataset.mode; save(); render(); }
  else if (t.dataset.r){ S.saved.region = t.dataset.r; S.saved.from = 1; S.saved.to = t.dataset.r === "all" ? 197 : regionList(t.dataset.r).length; save(); render(); }
  else if (t.id === "rAll"){ S.saved.from = 1; S.saved.to = regionList(S.saved.region).length; save(); render(); }
  else if (t.classList.contains("tile")){ S.sel = t.dataset.cc; S.saved.sel = S.sel; save();
    document.querySelectorAll(".tile").forEach(x => x.setAttribute("aria-current", x.dataset.cc === S.sel));
    renderInfo(S.sel); flyTo(S.sel, true); }
  else if (t.classList.contains("choice")) answer(t.dataset.cc);
  else if (t.id === "nextBtn") next();
  else if (t.id === "tGrade") gradeTest();
  else if (t.dataset.ai !== undefined){
    // 一覧の国を選んだら、地図のその国が見えるところまで移動する
    setTestFocus(+t.dataset.ai);
    const wr = $("tmapwrap"), nd = S.sheet.layout && S.sheet.layout.nodes[+t.dataset.ai];
    if (wr && nd){
      wr.scrollTo({ left: nd.x - wr.clientWidth / 2, top: nd.y - wr.clientHeight / 2, behavior: reduce ? "auto" : "smooth" });
      const sy = wr.getBoundingClientRect().top + nd.y;   // 画面の上での、その国の番号の高さ
      if (sy < 40 || sy > innerHeight - 40) window.scrollTo({ top: scrollY + sy - innerHeight / 3, behavior: reduce ? "auto" : "smooth" });
    }
  }
  else if (t.id === "tPick15" || t.id === "tPickAll"){ S.saved.pick15 = t.id === "tPick15"; delete S.saved.testAll; save(); renderTest(); }
  else if (t.id === "tNew"){ newTest(); S.test.key = testKey(); renderTest(); }
  else if (t.id === "tRetry"){ S.test.name = []; S.test.flag = []; S.test.graded = false; renderTest(); }
  else if (t.id === "resetBtn"){ $("resetWrap").innerHTML = `<span class="confirm">本当に消しますか？<button id="resetYes">消す</button><button id="resetNo" style="border-color:var(--line);color:var(--muted)">やめる</button></span>`; }
  else if (t.id === "resetYes"){ S.saved.p = {}; save(); $("resetWrap").innerHTML = `<button class="link" id="resetBtn">記録をリセット</button>`; render(); }
  else if (t.id === "resetNo"){ $("resetWrap").innerHTML = `<button class="link" id="resetBtn">記録をリセット</button>`; }
});
document.addEventListener("focusin", e => {
  const id = e.target.id || "";
  if (/^t[nf]-\d+$/.test(id)) setTestFocus(+e.target.dataset.i);
});
// 地図の番号（または国の点）をタップしたとき。スクロールのときは click が来ないので反応しない
document.addEventListener("click", e => {
  const TS = curSheet();
  if (e.target.id !== "tmap" || !TS || !TS.layout) return;
  const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 22;
  for (const nd of TS.layout.nodes){
    const dd = Math.min(Math.hypot(nd.x - x, nd.y - y), Math.hypot(nd.ax - x, nd.ay - y));
    if (dd < bd){ bd = dd; best = nd; }
  }
  if (best) setTestFocus(best.i);
});
document.addEventListener("input", e => {
  if (e.target.id && e.target.id.startsWith("tn-")) S.test.name[+e.target.dataset.i] = e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.id && e.target.id.startsWith("tf-")){ S.test.flag[+e.target.dataset.i] = e.target.value; return; }
  if (e.target.id !== "rFrom" && e.target.id !== "rTo") return;
  let a = +$("rFrom").value, b = +$("rTo").value;
  if (a > b) [a, b] = [b, a];
  S.saved.from = a; S.saved.to = b; save(); render();
});
document.addEventListener("keydown", e => {
  if (S.saved.mode === "browse" || isSheetMode() || !S.q || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  if (!S.q.done && /^[1-4]$/.test(e.key)) answer(S.q.opts[+e.key - 1]);
  else if (S.q.done && (e.key === "Enter" || e.key === " ") && document.activeElement?.id !== "nextBtn"){ e.preventDefault(); next(); }
});
render();
</script>
